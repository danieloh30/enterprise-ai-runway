quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=32K
quarkus.http.idle-timeout=30s
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=5s
quarkus.datasource.devservices.enabled=false
quarkus.http.header.X-Content-Type-Options.value=nosniff
quarkus.http.header.Referrer-Policy.value=no-referrer
quarkus.http.header.Cache-Control.value=no-store
quarkus.http.header.X-Frame-Options.value=DENY
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.http.port=8090
quarkus.application.name=enterprise-ai-runway
quarkus.http.header.Content-Security-Policy.value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'
quarkus.smallrye-openapi.info-title=Enterprise AI Runway API
quarkus.smallrye-openapi.info-version=1.0.0
runway.demo-key=${DEMO_API_KEY}
runway.gateway-url=${MCP_GATEWAY_URL}
runway.gateway-read-key=${GATEWAY_READ_KEY}
runway.gateway-write-key=${GATEWAY_WRITE_KEY}
runway.gateway-kind=${GATEWAY_KIND:Local policy simulator}
runway.model=${LLM_MODEL:gpt-4.1-mini}
runway.llm-base-url=${LLM_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.base-url=${runway.llm-base-url}
quarkus.langchain4j.openai.api-key=${LLM_API_KEY:${OPENAI_API_KEY:not-configured}}
quarkus.langchain4j.openai.chat-model.model-name=${runway.model}
quarkus.langchain4j.openai.chat-model.temperature=0.1
quarkus.langchain4j.openai.chat-model.max-completion-tokens=1200
quarkus.langchain4j.openai.timeout=35s
quarkus.langchain4j.openai.max-retries=1
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
quarkus.langchain4j.devservices.enabled=false
quarkus.langchain4j.mcp.enterprise.transport-type=streamable-http
quarkus.langchain4j.mcp.enterprise.url=${runway.gateway-url}/mcp
quarkus.langchain4j.mcp.enterprise.header.Authorization=Bearer ${runway.gateway-read-key}
quarkus.langchain4j.mcp.enterprise.tool-execution-timeout=15s
quarkus.langchain4j.mcp.enterprise.auto-health-check=false
quarkus.oidc.tenant-enabled=${OIDC_ENABLED:false}
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/runway}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:runway}
quarkus.oidc.token.audience=${OIDC_CLIENT_ID:runway}
quarkus.oidc.roles.role-claim-path=groups
quarkus.keycloak.devservices.enabled=false
