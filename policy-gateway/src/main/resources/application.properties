# Shared datasource and HTTP defaults: shared/src/main/resources/META-INF/microprofile-config.properties
quarkus.http.port=8091
quarkus.application.name=runway-policy-gateway

# Gateway policy and backend access.
runway.read-key=${GATEWAY_READ_KEY}
runway.write-key=${GATEWAY_WRITE_KEY}
runway.backend-key=${BACKEND_KEY}
runway.backend-url=${MCP_BACKEND_URL}
runway.rate-limit=${GATEWAY_RATE_LIMIT:60}
