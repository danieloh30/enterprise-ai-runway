top; configure terminal;

#
# Enterprise AI Runway - MCP reverse proxy for the local demo.
#
# The agent-runtime posts MCP JSON-RPC (and reads SSE) at /mcp on this gateway.
# DataPower forwards each request unchanged to the Quarkus policy-gateway running
# on the laptop (reachable from the container as host.containers.internal:8091),
# preserving the Authorization, Accept, Content-Type and Mcp-* headers and adding
# no Origin header, so the policy-gateway's credential, rate and tool checks still
# apply. This file is auto-executed from /drouter/config/auto-startup.cfg at boot.
#

# Empty processing policy: no rules match, so messages pass through untouched.
stylepolicy "mcp-passthru"
exit

# HTTP front side handler that accepts the runtime's MCP calls.
source-http "mcp-fsh"
  local-address 0.0.0.0
  port 8788
  http-client-version HTTP/1.1
  allowed-features "HTTP-1.0+HTTP-1.1+POST+GET+PUT+DELETE+QueryString"
  persistent-connections
  max-url-len 16384
  max-total-header-len 128000
exit

# Multi-Protocol Gateway: static-backend reverse proxy to the policy-gateway.
mpgw "mcp-gateway"
  summary "MCP reverse proxy to the policy-gateway"
  priority normal
  front-protocol mcp-fsh
  xml-manager default
  type static-backend
  backend-url "http://host.containers.internal:8091"
  propagate-uri
  request-type unprocessed
  response-type unprocessed
  stylepolicy "mcp-passthru"
  request-attachments strip
  response-attachments strip
  front-timeout 120
  back-timeout 120
  http-server-version HTTP/1.1
  persistent-connections
  no loop-detection
  process-http-errors
  admin-state enabled
exit

# WebGUI management interface for the live demo: browse the MCP gateway, the
# front side handler and the system/audit logs at https://127.0.0.1:9090
# (default login admin/admin; self-signed cert, so the browser will warn).
# Defined last so the MCP reverse proxy above always loads even if this fails.
web-mgmt
  admin-state enabled
  local-address 0.0.0.0
  port 9090
  idle-timeout 9000
exit
