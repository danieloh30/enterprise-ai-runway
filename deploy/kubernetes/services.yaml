      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: runway-tools
  namespace: enterprise-ai-runway
spec:
  selector: {app: runway-tools}
  ports:
    - {name: http, port: 8092, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: enterprise-ai-runway
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-to-gateway
  namespace: enterprise-ai-runway
spec:
  podSelector:
    matchLabels: {app: runway-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: runway-agent}
      ports:
        - {protocol: TCP, port: 8091}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-tools
  namespace: enterprise-ai-runway
spec:
  podSelector:
    matchLabels: {app: runway-tools}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: runway-gateway}
      ports:
        - {protocol: TCP, port: 8092}
