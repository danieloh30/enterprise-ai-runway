# Shared datasource and HTTP defaults: shared/src/main/resources/META-INF/microprofile-config.properties
quarkus.http.port=8092
quarkus.application.name=runway-mcp-tools

# MCP server and database migrations.
quarkus.flyway.migrate-at-start=true
quarkus.mcp.server.server-info.name=runway-enterprise-tools
quarkus.mcp.server.server-info.version=1.0.0
quarkus.mcp.server.http.streamable.auto-init=true
runway.backend-key=${BACKEND_KEY}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8090
