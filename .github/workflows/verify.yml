name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Java services
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check frontend syntax and launcher
        run: |
          node --check agent-runtime/src/main/resources/META-INF/resources/app.js
          bash -n demo.sh
          python3 -m py_compile scripts/smoke.py
      - name: Test dependency merge safeguards
        run: node --test tests/dependabot-automerge.test.cjs
