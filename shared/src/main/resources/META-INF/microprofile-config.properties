# Common defaults for the runtime, policy gateway and MCP tools.
# Each service application.properties and environment variables can override these.

# One persistent PostgreSQL database is shared by all services.
# demo.sh supplies the connection values; the JDBC URL disables automatic DB Dev Services.
# The PostgreSQL driver supplies db-kind automatically.
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=5s

# Shared HTTP limits and response headers.
quarkus.http.host=0.0.0.0
%dev.quarkus.http.host=127.0.0.1
quarkus.http.limits.max-body-size=32K
quarkus.http.idle-timeout=30s
quarkus.http.header.X-Content-Type-Options.value=nosniff
quarkus.http.header.Referrer-Policy.value=no-referrer
quarkus.http.header.Cache-Control.value=no-store
quarkus.http.header.X-Frame-Options.value=DENY

# Compact, consistent output for the foreground dev launcher.
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
